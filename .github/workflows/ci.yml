name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadowsend
          POSTGRES_PASSWORD: shadowsend_ci
          POSTGRES_DB: shadowsend_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowsend -d shadowsend_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shadowsend:shadowsend_ci@127.0.0.1:5432/shadowsend_ci?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm test -- --maxWorkers=2
      - run: npm run test:release-tag
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
